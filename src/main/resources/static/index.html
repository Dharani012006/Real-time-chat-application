<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Chat Application</title>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 500px;
            height: 650px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #6c5ce7;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h2 {
            margin: 0 0 6px;
        }

        .status {
            font-size: 14px;
        }

        .user-section {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        .user-section input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
        }

        .messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #f7f7fb;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            margin-bottom: 10px;
            border-radius: 15px;
            word-wrap: break-word;
        }

        .my-message {
            margin-left: auto;
            background: #6c5ce7;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .other-message {
            margin-right: auto;
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        .sender {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .message-text {
            font-size: 15px;
        }

        .time {
            font-size: 10px;
            margin-top: 5px;
            opacity: 0.7;
            text-align: right;
        }

        #typing {
            height: 25px;
            padding-left: 15px;
            font-size: 13px;
            color: #777;
        }

        .input-section {
            display: flex;
            padding: 12px;
            gap: 8px;
            border-top: 1px solid #eee;
        }

        .input-section input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
        }

        .input-section button {
            border: none;
            background: #6c5ce7;
            color: white;
            padding: 0 18px;
            border-radius: 10px;
            cursor: pointer;
        }

        .input-section button:hover {
            background: #5849d6;
        }

        .clear-button {
            margin: 0 12px 12px;
            padding: 9px;
            border: none;
            border-radius: 8px;
            background: #eee;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="chat-container">

    <div class="header">
        <h2>💬 Real-Time Chat</h2>
        <div class="status" id="status">🔴 Connecting...</div>
    </div>

    <div class="user-section">
        <input type="text" id="name" value="DHARANI V" placeholder="Enter your name">
    </div>

    <div class="messages" id="messages"></div>

    <div id="typing"></div>

    <div class="input-section">
        <input type="text" id="message" placeholder="Type a message...">
        <button onclick="sendMessage()">Send</button>
    </div>

    <button class="clear-button" onclick="clearChat()">Clear Chat</button>

</div>

<script>
    let stompClient = null;
    let typingTimeout = null;

    const nameInput = document.getElementById("name");
    const messageInput = document.getElementById("message");
    const messagesDiv = document.getElementById("messages");
    const typingDiv = document.getElementById("typing");
    const statusDiv = document.getElementById("status");

    function connect() {
        const socket = new SockJS("/chat");
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function () {

            statusDiv.innerHTML = "🟢 Online";

            stompClient.subscribe("/topic/messages", function (message) {
                const data = JSON.parse(message.body);
                showMessage(data);
            });

            stompClient.subscribe("/topic/typing", function (message) {
                const data = JSON.parse(message.body);
                showTyping(data);
            });

        }, function () {
            statusDiv.innerHTML = "🔴 Offline";
        });
    }

    function loadMessages() {
        fetch("/api/messages")
            .then(response => response.json())
            .then(messages => {
                messages.forEach(message => {
                    showMessage(message);
                });
            })
            .catch(error => {
                console.log(error);
            });
    }

    function sendMessage() {

        const sender = nameInput.value.trim();
        const content = messageInput.value.trim();

        if (!sender || !content || !stompClient) {
            return;
        }

        const now = new Date();

        const time = now.toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit"
        });

        const message = {
            sender: sender,
            content: content,
            time: time,
            type: "CHAT"
        };

        stompClient.send("/app/send", {}, JSON.stringify(message));

        messageInput.value = "";
    }

    function sendTyping() {

        if (!stompClient) {
            return;
        }

        const sender = nameInput.value.trim();

        const message = {
            sender: sender,
            content: "",
            time: "",
            type: "TYPING"
        };

        stompClient.send("/app/typing", {}, JSON.stringify(message));
    }

    function showTyping(message) {

        if (message.sender === nameInput.value.trim()) {
            return;
        }

        typingDiv.innerHTML = message.sender + " is typing...";

        clearTimeout(typingTimeout);

        typingTimeout = setTimeout(function () {
            typingDiv.innerHTML = "";
        }, 1500);
    }

    function showMessage(message) {

        if (message.type !== "CHAT") {
            return;
        }

        const div = document.createElement("div");

        const currentUser = nameInput.value.trim();

        if (message.sender === currentUser) {
            div.className = "message my-message";
        } else {
            div.className = "message other-message";
        }

        div.innerHTML =
            '<div class="sender">' + escapeHtml(message.sender) + '</div>' +
            '<div class="message-text">' + escapeHtml(message.content) + '</div>' +
            '<div class="time">' + escapeHtml(message.time) + '</div>';

        messagesDiv.appendChild(div);

        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function escapeHtml(text) {

        const div = document.createElement("div");

        div.textContent = text;

        return div.innerHTML;
    }

    function clearChat() {
        messagesDiv.innerHTML = "";
    }

    messageInput.addEventListener("input", function () {

        if (messageInput.value.trim() !== "") {
            sendTyping();
        }
    });

    messageInput.addEventListener("keydown", function (event) {

        if (event.key === "Enter") {
            sendMessage();
        }
    });

    window.onload = function () {
        loadMessages();
        connect();
    };
</script>

</body>
</html>
